<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ブラウザー内で画像を圧縮・サイズ変更・形式変換するツール"><title>画像圧縮・サイズ変更</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="badge">IMAGE OPTIMIZER</p><h1>画像圧縮・サイズ変更</h1><p>画像を端末内で処理し、容量・大きさ・形式を調整します。</p></div><a class="home" href="https://kentaro0810.github.io/secret-links/">リンク集へ戻る</a></header><section class="privacy"><strong>🔒 端末内処理</strong><span>選んだ画像はサーバーへ送信されません。</span></section><section id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="画像を選択"><span class="drop-icon">🖼️</span><h2>画像を選択</h2><p>ここへドラッグ＆ドロップ、またはタップして選択</p><small>JPEG・PNG・WebP、1枚ずつ処理</small><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></section><section id="editor" class="editor hidden"><div class="preview-card"><div class="preview-wrap"><img id="preview" alt="選択した画像のプレビュー"></div><div class="file-info"><div><span>元画像</span><strong id="originalInfo"></strong></div><div><span>変換後の予測</span><strong id="resultInfo">設定後に表示</strong></div></div><button id="changeImage" class="secondary wide">別の画像を選ぶ</button></div><div class="settings-card"><section><div class="section-title"><h2>画像サイズ</h2><label class="switch-label"><input id="keepRatio" type="checkbox" checked>縦横比を維持</label></div><div class="dimension-grid"><label>幅（px）<input id="widthInput" type="number" min="1" max="12000"></label><span>×</span><label>高さ（px）<input id="heightInput" type="number" min="1" max="12000"></label></div><div class="quick-sizes"><button data-scale="1">100%</button><button data-scale="0.75">75%</button><button data-scale="0.5">50%</button><button data-scale="0.25">25%</button></div></section><section><h2>出力形式</h2><div class="format-buttons"><button class="format active" data-format="image/jpeg">JPEG</button><button class="format" data-format="image/png">PNG</button><button class="format" data-format="image/webp">WebP</button></div></section><section id="qualitySection"><div class="section-title"><h2>画質</h2><output id="qualityOutput">82%</output></div><input id="qualityInput" type="range" min="10" max="100" value="82"><div class="scale-labels"><span>軽量</span><span>高画質</span></div></section><section><h2>ファイル名</h2><div class="filename-row"><input id="filenameInput" type="text" maxlength="80"><span id="extensionLabel">.jpg</span></div></section><button id="convertButton" class="primary wide">画像を変換する</button><p id="status" class="status" aria-live="polite"></p></div></section><section id="resultCard" class="result-card hidden"><div><p class="badge blue">COMPLETED</p><h2>変換が完了しました</h2><p id="savingResult"></p></div><div class="result-actions"><button id="downloadButton" class="primary">ダウンロード</button><button id="resetButton" class="secondary">別の画像を処理</button></div></section><canvas id="canvas" hidden></canvas></main><script src="script.js"></script></body></html>
